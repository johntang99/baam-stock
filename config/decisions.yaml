- id: D-41
  topic: 有效期与过期显示
  decision: 快照 valid_until（盘中 = 下次定时 + 5 分钟；盘后 = 次日盘前首个快照）；预测 valid_until = target_end_at（条件预测 = 触发截止）；被修订的预测灰显并链接新版；过期未结算显示"已过期，待结算"
  source: S2§5、PPT
  status: [proposed]
  status_note: null
  lock_at: Phase 1
  params: {intraday_snapshot_valid_until: next_scheduled + 5min, intraday_offset_min: 5, prediction_valid_until: target_end_at}
- id: D-42
  topic: 行业模板
  decision: industry_template ∈ {semiconductor, bank, biotech, generic} 决定默认指标、来源与影响维度；同一政策事件按模板分别解读（例：出口管制对芯片 = 收入敞口，对银行 = 无直接敞口/客户信用）；银行与生物医药模板只做配置与测试，不进首版验收名单（与 D-03 一致）
  source: S1「跨行业配置」、S2§1、PPT
  status: [proposed]
  status_note: null
  lock_at: Phase 2
  params:
    industry_templates: [semiconductor, bank, biotech, generic]
    acceptance_excluded: [bank, biotech]
- id: D-43
  topic: 每日预测时刻表
  decision: sched-0.1：08:30 盘前展望（next_regular_session，当日）；10:00、11:30、13:00、14:30 regular_60m + regular_60m_move（14:30 加 regular_to_close）；16:30 盘后展望（下一时段）。半日市：保留 10:00、11:30，11:30 加至收盘，跳过 13:00/14:30，盘后展望改 13:30；休市日不发；槽位 + 180s 未发布 → abstained/slot_missed，不补发
  source: 用户 2026-11-26、S3§3.1
  status: [proposed]
  status_note: null
  lock_at: Phase 1
  params:
    schedule: sched-0.1
    slots:
    - time_et: 08:30
      targets: [next_regular_session]
      note: 盘前展望（当日）
    - time_et: '10:00'
      targets: [regular_60m, regular_60m_move]
    - time_et: '11:30'
      targets: [regular_60m, regular_60m_move]
    - time_et: '13:00'
      targets: [regular_60m, regular_60m_move]
    - time_et: '14:30'
      targets: [regular_60m, regular_60m_move, regular_to_close]
    - time_et: '16:30'
      targets: [next_regular_session]
      note: 盘后展望（下一时段）
    half_day:
      keep: ['10:00', '11:30']
      to_close_at: '11:30'
      skip: ['13:00', '14:30']
      afterhours_outlook_et: '13:30'
    holiday: no_publish
    slot_grace_s: 180
    on_slot_missed: abstained/slot_missed
    backfill: false
- id: D-44
  topic: 预测与实际对照
  decision: 每条预测一行 forecast_vs_actual：展示路径 = 锁定分位数按 √时间缩放（仅展示，sqrt_time_v1），实际路径 = 起算后每分钟同步相对收益；滚动准确率 forecast_accuracy_rollups（当日 / 20 日 / 60 日 / 上线以来，n < 30 标样本不足）。对照只通过 §7.1 闭环进入模型
  source: 用户 2026-11-26、S3§8
  status: [proposed]
  status_note: null
  lock_at: Phase 1（后端）/ Phase 2（界面）
  params:
    table: forecast_vs_actual
    display_path: sqrt_time_v1
    actual_path_resolution: 1min
    rollup_table: forecast_accuracy_rollups
    rollup_windows: [当日, 20d, 60d, since_launch]
    insufficient_sample_n_lt: 30
- id: D-45
  topic: 信息采集可见性
  decision: 每次运行记录 collection_runs 与全部 collection_items（含去重、排除、待核、抓取失败），按渠道 × 类别汇总；受限材料只显示占位；授权新闻只显示标题与定位；行情以汇总项记录；条目保留 ≥ 2 年供回放
  source: 用户 2026-11-26、S1「四项时间」、S2§3.1–3.2
  status: [proposed]
  status_note: null
  lock_at: Phase 1
  params:
    tables: [collection_runs, collection_items]
    retention_years_min: 2
- id: D-46
  topic: 推理可追溯
  decision: market_explanation 每条陈述必须引用证据/报价/采集项，无引用 → 校验拒绝并改放"未解释"；reasoning_trace 有序记录行情事实、时间对齐、证据、归因、反向检查、历史类比、缺口、结论；确定性步骤由代码生成，LLM 只起草归因与反向证据且必须引用
  source: 用户 2026-11-26、S2§3.5、MP §7-1
  status: [proposed]
  status_note: null
  lock_at: Phase 1
  params:
    trace_steps: [行情事实, 时间对齐, 证据, 归因, 反向检查, 历史类比, 缺口, 结论]
    uncited_statement: reject_to_unexplained
- id: D-47
  topic: 用户补充信息
  decision: 入口在 ① 信息采集；链接/文本/文件；类别 = 用户选择 ∪ 系统建议（置信度 ≥ 0.6，可多类别）；走与采集相同的核验（链接可达、来源信誉、原始来源追溯、内容与时间一致、查重、未公开材料筛查）；状态 verified_primary / media_level / unverified / duplicate / rejected_restricted / fetch_failed；不默认可信；available_at = 提交时间；系统漏采的原始来源记为覆盖缺口
  source: 用户 2026-11-26、S1「四项时间」「内幕信息」、S2§3.2
  status: [proposed]
  status_note: null
  lock_at: Phase 2
  params:
    input_types: [link, text, file]
    suggest_confidence_min: 0.6
    multi_category: true
    statuses: [verified_primary, media_level, unverified, duplicate, rejected_restricted, fetch_failed]
    available_at: submitted_at
- id: D-48
  topic: '"继续分析"＝增量补充运行'
  decision: 见 §7.2：复用已有采集与核验，只刷新行情 + 增量检索 + 用户条目，重跑分析与预测生成新版本；trigger_type = user_supplement、is_primary = false、单独计分；槽位预测不变；先对提交者可见，核验后共享；每用户每证券 2 分钟 1 次
  source: 用户 2026-11-26、S3§2、§4(5)
  status: [proposed]
  status_note: null
  lock_at: Phase 2
  params: {trigger_type: user_supplement, is_primary: false, rate_limit_per_user_security_min: 2, ref: §7.2}
