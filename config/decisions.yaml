  source: S3§3.1(3)、MEMO A-1
  status: [confirmed]
  status_note: 用户 2026-11-26 确认采用默认值
  lock_at: Phase 0
  params:
    k: 0.25
    sigma_model: sigma-0.1
    lookback_sessions: 20
    ewma_half_life_days: 10
    bucket: same_time_of_day
    on_missing_sigma: abstain
    abstain_reason: insufficient_data
    locked_fields: [sigma_hat_pp, k]
