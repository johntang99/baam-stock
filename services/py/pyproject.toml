[project]
name = "sr"
version = "0.0.1"
description = "baam-stock stock research services (research only, no trade execution)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars>=4.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.scripts]
sr = "sr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sr"]
